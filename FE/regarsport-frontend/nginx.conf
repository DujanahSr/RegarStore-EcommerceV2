server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 20m;

    # Docker DNS; resolve saat request supaya nginx tetap hidup walau gateway belum siap
    resolver 127.0.0.11 valid=10s;
    set $gateway http://api-gateway:8080;

    location /api/ {
        proxy_pass $gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass $gateway;
    }

    # Dokumentasi API (Swagger UI gabungan semua service di gateway)
    location ~ ^/(swagger-ui|webjars/|v3/api-docs) {
        proxy_pass $gateway;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}
