<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A251E"/>
      <stop offset="100%" stop-color="#0E1612"/>
    </linearGradient>

    <!-- Crimson Terracotta Primary Gradient -->
    <linearGradient id="terracottaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5A43"/>
      <stop offset="60%" stop-color="#D9381E"/>
      <stop offset="100%" stop-color="#9E2214"/>
    </linearGradient>

    <!-- Speed / Store Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Subtle Outer Glow -->
    <filter id="badgeGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Outer Rounded Athletic Squircle -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bgGrad)" stroke="#B9382B" stroke-width="2.5" filter="url(#badgeGlow)"/>

  <!-- Subtle Topographic / Dynamic Speed Ring -->
  <rect x="11" y="11" width="106" height="106" rx="23" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5" stroke-dasharray="8 4"/>

  <!-- Stylized Geometric "R" Monogram -->
  <!-- Left Vertical Spine -->
  <path d="M34 32 H48 V96 H34 Z" fill="url(#terracottaGrad)"/>
  <!-- Top Diagonal Bevel Accent on Spine -->
  <path d="M34 32 L48 24 V32 H34 Z" fill="#FF7E6B"/>

  <!-- Upper Loop of "R" -->
  <path d="M48 32 H76 C86.5 32 94 39.5 94 50 C94 60.5 86.5 68 76 68 H48 V55 H74 C77.5 55 80 52.8 80 50 C80 47.2 77.5 45 74 45 H48 V32 Z" fill="url(#terracottaGrad)"/>

  <!-- Dynamic Athletic Kick Leg of "R" -->
  <path d="M62 64 L81 96 H97 L76 64 H62 Z" fill="url(#terracottaGrad)"/>

  <!-- Forward Speed Streak / "S" Flow Cutting Under the Leg -->
  <path d="M34 88 L52 88 L64 74 L52 74 Z" fill="url(#accentGrad)"/>
  <!-- Sleek Crown Starlet / Atelier Dot -->
  <polygon points="90,26 94,34 102,34 95,39 98,47 90,42 82,47 85,39 78,34 86,34" fill="#F59E0B" transform="scale(0.5) translate(80, 20)"/>
</svg>