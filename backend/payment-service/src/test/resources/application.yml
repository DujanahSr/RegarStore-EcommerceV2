server:
  port: 0

spring:
  application:
    name: payment-service-test

  datasource:
    url: jdbc:h2:mem:payment_test_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false

  rabbitmq:
    listener:
      simple:
        auto-startup: false

midtrans:
  server-key: SB-Mid-server-TEST_KEY_12345
  client-key: SB-Mid-client-TEST_KEY_12345
  is-production: false
