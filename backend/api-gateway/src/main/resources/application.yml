server:
  port: 8080

spring:
  application:
    name: api-gateway

  threads:
    virtual:
      enabled: true

  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
      routes:
        # Auth Service Route
        - id: auth-service
          uri: http://${AUTH_SERVICE_HOST:localhost}:8086
          predicates:
            - Path=/api/v1/auth/**, /api/v1/admin/users/**
          filters:
            - AuthenticationFilter

        # Catalog Service Route
        - id: catalog-service
          uri: http://${CATALOG_SERVICE_HOST:localhost}:8087
          predicates:
            - Path=/api/v1/categories/**, /api/v1/products/**, /api/v1/upload, /api/v1/admin/reviews/**, /uploads/**
          filters:
            - AuthenticationFilter

        # Order Service Route
        - id: order-service
          uri: http://${ORDER_SERVICE_HOST:localhost}:8088
          predicates:
            - Path=/api/v1/orders/**, /api/v1/cart/**, /api/v1/wishlist/**, /api/v1/warranty-claims/**, /api/v1/admin/orders/**
          filters:
            - AuthenticationFilter

        # Payment Service Route
        - id: payment-service
          uri: http://${PAYMENT_SERVICE_HOST:localhost}:8089
          predicates:
            - Path=/api/v1/payments/**
          filters:
            - AuthenticationFilter

        # Swagger Docs Aggregation Routes
        - id: auth-docs
          uri: http://${AUTH_SERVICE_HOST:localhost}:8086
          predicates:
            - Path=/v3/api-docs/auth
          filters:
            - SetPath=/v3/api-docs

        - id: catalog-docs
          uri: http://${CATALOG_SERVICE_HOST:localhost}:8087
          predicates:
            - Path=/v3/api-docs/catalog
          filters:
            - SetPath=/v3/api-docs

        - id: order-docs
          uri: http://${ORDER_SERVICE_HOST:localhost}:8088
          predicates:
            - Path=/v3/api-docs/order
          filters:
            - SetPath=/v3/api-docs

        - id: payment-docs
          uri: http://${PAYMENT_SERVICE_HOST:localhost}:8089
          predicates:
            - Path=/v3/api-docs/payment
          filters:
            - SetPath=/v3/api-docs

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true
    urls:
      - name: "1. Auth & Identity Service"
        url: /v3/api-docs/auth
      - name: "2. Product Catalog Service"
        url: /v3/api-docs/catalog
      - name: "3. Order & Cart Service"
        url: /v3/api-docs/order
      - name: "4. Payment & Notification Service"
        url: /v3/api-docs/payment

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,prometheus
