server:
  port: 0

spring:
  application:
    name: catalog-service-test

  datasource:
    url: jdbc:h2:mem:catalog_test_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false

  cache:
    type: simple
